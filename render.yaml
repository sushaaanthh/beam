services:
  - type: web
    name: beam-api
    runtime: docker
    plan: free
    # Neon database is in ap-southeast-1 (Singapore); keep the API close to it.
    region: singapore
    rootDir: beam-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Paste the Neon connection string when Render prompts for this value.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: JWT_ISSUER
        value: beam-api
      - key: BACKEND_CORS_ORIGINS
        value: '["https://beam-major.vercel.app"]'
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
