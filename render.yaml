databases:
  - name: beam-postgres
    databaseName: beam_db
    user: beam
    plan: free
    region: oregon

services:
  - type: web
    name: beam-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: beam-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: beam-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: JWT_ISSUER
        value: beam-api
      - key: BACKEND_CORS_ORIGINS
        value: '["https://your-project.vercel.app"]'
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
